name: publish

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: fork-publication-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  RELEASE_TAG: internal-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

jobs:
  build:
    if: >-
      github.repository == 'r90group/Cap' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.target }}

      - uses: ./.github/actions/setup-js

      - name: Configure fork build
        shell: bash
        env:
          SELF_HOST_URL: ${{ secrets.SELF_HOST_URL }}
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = fs.readFileSync('apps/desktop/src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
          const url = new URL(process.env.SELF_HOST_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) throw new Error('SELF_HOST_URL must be a credential-free HTTPS origin');
          fs.writeFileSync('.env', `appVersion=${version}\nVITE_ENVIRONMENT=production\nVITE_DISABLE_UPDATES=true\nVITE_SERVER_URL=${url.origin}\nNEXT_PUBLIC_WEB_URL=${url.origin}\nNEXTAUTH_URL=${url.origin}\nRUST_TARGET_TRIPLE=${process.env.RUST_TARGET_TRIPLE}\n`);
          fs.writeFileSync(`release-${process.env.RUST_TARGET_TRIPLE}.json`, JSON.stringify({ revision: process.env.RELEASE_SHA, version, target: process.env.RUST_TARGET_TRIPLE }));
          NODE

      - name: Run cap-setup
        shell: bash
        run: pnpm -w cap-setup
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Build cap-muxer sidecar
        shell: bash
        run: ./scripts/build-cap-muxer.sh ${{ matrix.target }}

      - name: Build fork app
        working-directory: apps/desktop
        shell: bash
        run: pnpm build:tauri --target ${{ matrix.target }} --config src-tauri/tauri.prod.conf.json
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'

      - name: Collect fork assets
        shell: bash
        run: |
          mkdir publish
          cp release-${{ matrix.target }}.json publish/
          if [ "$RUNNER_OS" = macOS ]; then
            cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg publish/
            cp target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz* publish/
          else
            cp target/${{ matrix.target }}/release/bundle/nsis/*.exe* publish/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.target }}
          path: publish/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          pattern: cap-*
          path: artifacts
          merge-multiple: true

      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Verify and inventory fork artifacts
        shell: bash
        run: bash scripts/verify-fork-artifacts.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Resolve exact-revision candidate
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let candidate;
            for await (const page of github.paginate.iterator(github.rest.repos.listReleases, { owner, repo, per_page: 100 })) {
              candidate = page.data.find(release => release.tag_name === tag);
              if (candidate) break;
            }
            if (!candidate) candidate = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: process.env.RELEASE_SHA, draft: true, prerelease: true, name: `Internal build ${process.env.RELEASE_SHA.slice(0, 12)}`, body: `R90 fork desktop build from ${process.env.RELEASE_SHA}. Candidate awaiting installed-artifact smoke.` })).data;
            let tagged;
            try { tagged = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data.object.sha; }
            catch (error) {
              if (error.status !== 404) throw error;
              tagged = (await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: process.env.RELEASE_SHA })).data.object.sha;
            }
            if (tagged !== process.env.RELEASE_SHA) throw new Error('Existing candidate tag revision mismatch');
            core.setOutput('release_id', candidate.id);
            core.setOutput('draft', candidate.draft);

      - name: Complete draft assets before publication
        if: steps.candidate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.candidate.outputs.release_id }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --method PATCH -F draft=false --jq .html_url

  smoke:
    needs: [build, release]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || needs.release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            script: bash scripts/smoke-fork-macos.sh
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            script: pwsh -File scripts/smoke-fork-windows.ps1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: cap-${{ matrix.target }}
          path: artifacts

      - name: Inventory pre-publication artifacts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS

      - name: Download published candidate
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          mkdir artifacts
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            [[ "$name" =~ ^[A-Za-z0-9._+-]+$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "artifacts/$name"
          done

      - name: Install and launch published app
        shell: bash
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: smoke/
          if-no-files-found: error

  promote:
    needs: [release, smoke]
    if: github.event_name == 'workflow_run'
    concurrency:
      group: fork-healthy-channel
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.RELEASE_SHA;
            const tag = process.env.RELEASE_TAG;
            const candidate = (await github.rest.repos.getRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID) })).data;
            await github.rest.repos.updateRelease({ owner, repo, release_id: candidate.id, draft: false, body: `R90 fork desktop build from ${sha}. Installed-artifact smoke passed on macOS Apple Silicon and Windows x64: https://github.com/${owner}/${repo}/actions/runs/${context.runId}. macOS is ad-hoc signed, not notarized; Windows is not Authenticode signed. Updater signatures and signed SHA256SUMS are included.` });
            const downloads = candidate.assets.filter(a => a.name.endsWith('.dmg') || a.name.endsWith('.exe')).map(a => `- [${a.name}](${a.browser_download_url})`).join('\n');
            const body = `Healthy R90 fork desktop build from [${sha}](https://github.com/${owner}/${repo}/commit/${sha}).\n\n${downloads}\n\n[All artifacts, updater signatures and checksums](${candidate.html_url}).\n\nInstalled-artifact smoke passed on macOS Apple Silicon and Windows x64: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n\nmacOS is ad-hoc signed, not notarized; Windows is not Authenticode signed. Existing first-launch OS consent remains required. No automatic upstream update is published by this workflow.`;
            let previousRelease;
            let previousSha;
            try {
              previousRelease = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'internal-latest' })).data;
              previousSha = (await github.rest.git.getRef({ owner, repo, ref: 'tags/internal-latest' })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (previousSha && previousSha !== sha && !previousRelease?.assets.length) {
              const comparison = (await github.rest.repos.compareCommits({ owner, repo, base: previousSha, head: sha })).data.status;
              if (comparison === 'behind') {
                core.notice('Published immutable candidate without superseding a newer healthy build');
                return;
              }
              if (comparison !== 'ahead') throw new Error('Release channel history diverged');
            }
            const previousName = previousRelease?.name || 'Previous healthy internal build';
            const previousBody = previousRelease?.body;
            if (previousRelease?.assets.length) {
              const archiveTag = `internal-${previousSha}`;
              try { await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${archiveTag}`, sha: previousSha }); }
              catch (error) {
                if (error.status !== 422) throw error;
                const archived = (await github.rest.git.getRef({ owner, repo, ref: `tags/${archiveTag}` })).data.object.sha;
                if (archived !== previousSha) throw new Error('Existing archive tag revision mismatch');
              }
              await github.rest.repos.updateRelease({ owner, repo, release_id: previousRelease.id, tag_name: archiveTag });
              previousRelease = undefined;
            }
            let channel;
            try {
              channel = previousRelease
                ? (await github.rest.repos.updateRelease({ owner, repo, release_id: previousRelease.id, body, name: `Internal build ${sha.slice(0, 12)}` })).data
                : (await github.rest.repos.createRelease({ owner, repo, tag_name: 'internal-latest', target_commitish: sha, name: `Internal build ${sha.slice(0, 12)}`, body, prerelease: true, make_latest: 'false' })).data;
              await github.rest.git.updateRef({ owner, repo, ref: 'tags/internal-latest', sha, force: true });
              const current = (await github.rest.git.getRef({ owner, repo, ref: 'tags/internal-latest' })).data.object.sha;
              if (current !== sha) throw new Error('Release channel revision readback failed');
            } catch (error) {
              if (previousSha) {
                await github.rest.git.updateRef({ owner, repo, ref: 'tags/internal-latest', sha: previousSha, force: true });
                const restoredBody = previousBody || `Restored previous healthy build: https://github.com/${owner}/${repo}/releases/tag/internal-${previousSha}`;
                if (channel) {
                  await github.rest.repos.updateRelease({ owner, repo, release_id: channel.id, body: restoredBody, name: previousName });
                } else if (!previousRelease) {
                  await github.rest.repos.createRelease({ owner, repo, tag_name: 'internal-latest', target_commitish: previousSha, body: `Previous build and retained downloads: https://github.com/${owner}/${repo}/releases/tag/internal-${previousSha}`, name: previousName, prerelease: true, make_latest: 'false' });
                }
              } else if (channel) {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: channel.id });
                await github.rest.git.deleteRef({ owner, repo, ref: 'tags/internal-latest' });
              }
              throw error;
            }
            core.summary.addHeading('Fork publication verified').addLink('Healthy release channel', channel.html_url).addRaw(`\nRevision: ${sha}\nCandidate: ${candidate.html_url}\nTargets: aarch64-apple-darwin, x86_64-pc-windows-msvc\nInstalled-artifact smoke: passed\n`);
            await core.summary.write();

  reject:
    needs: [release, smoke]
    if: always() && needs.release.result == 'success' && needs.smoke.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Withdraw unhealthy candidate without moving healthy channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --method PATCH -F draft=true --jq .html_url
