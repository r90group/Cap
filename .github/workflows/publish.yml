name: publish

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: fork-publication-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  RELEASE_TAG: internal-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

jobs:
  prepare:
    if: >-
      github.repository == 'r90group/Cap' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-js

      - name: Check native release version boundaries
        run: pnpm --dir apps/desktop exec vitest run scripts/release-version.test.js

      - name: Install updater key tooling
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Resolve release version and existing fork public key
        id: metadata
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          public_dir=$(mktemp -d)
          trap 'rm -rf "$public_dir"' EXIT
          export PUBLIC_PATH="$public_dir/updater.pub"
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" |
          minisign -R -s <(node --input-type=module -e 'const key=process.env.TAURI_SIGNING_PRIVATE_KEY; if(!key) throw new Error("Fork signing key is missing"); process.stdout.write(key.startsWith("untrusted comment:") ? key : Buffer.from(key.trim(),"base64"));') -p "$PUBLIC_PATH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { forkSourceVersion } from './apps/desktop/scripts/release-version.js';
          const base = fs.readFileSync('apps/desktop/src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
          const version = forkSourceVersion(base, process.env.RELEASE_SHA);
          const configured = Buffer.from(JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.prod.conf.json')).plugins.updater.pubkey, 'base64').toString('utf8').trim().split('\n').pop();
          const derived = fs.readFileSync(process.env.PUBLIC_PATH, 'utf8').trim().split('\n').pop();
          if (configured !== derived) throw new Error('Existing fork signing key does not match the committed public trust');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.mkdirSync('updater-public');
          fs.copyFileSync(process.env.PUBLIC_PATH, 'updater-public/updater.pub');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: updater-public
          path: updater-public/
          overwrite: true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.target }}

      - uses: ./.github/actions/setup-js

      - name: Configure fork build
        shell: bash
        env:
          SELF_HOST_URL: ${{ secrets.SELF_HOST_URL }}
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          const configPath = 'apps/desktop/src-tauri/tauri.prod.conf.json';
          const config = JSON.parse(fs.readFileSync(configPath));
          config.version = version;
          config.bundle.windows.wix.version = version;
          fs.writeFileSync(configPath, JSON.stringify(config));
          const url = new URL(process.env.SELF_HOST_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) throw new Error('SELF_HOST_URL must be a credential-free HTTPS origin');
          fs.writeFileSync('.env', `appVersion=${version}\nVITE_ENVIRONMENT=production\nVITE_SERVER_URL=${url.origin}\nNEXT_PUBLIC_WEB_URL=${url.origin}\nNEXTAUTH_URL=${url.origin}\nRUST_TARGET_TRIPLE=${process.env.RUST_TARGET_TRIPLE}\n`);
          fs.writeFileSync(`release-${process.env.RUST_TARGET_TRIPLE}.json`, JSON.stringify({ revision: process.env.RELEASE_SHA, version, target: process.env.RUST_TARGET_TRIPLE }));
          NODE

      - name: Run cap-setup
        shell: bash
        run: pnpm -w cap-setup
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Build cap-muxer sidecar
        shell: bash
        run: ./scripts/build-cap-muxer.sh ${{ matrix.target }}

      - name: Build fork app
        working-directory: apps/desktop
        shell: bash
        run: pnpm build:tauri --target ${{ matrix.target }} --config src-tauri/tauri.prod.conf.json
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'

      - name: Collect fork assets
        shell: bash
        run: |
          mkdir publish
          cp release-${{ matrix.target }}.json publish/
          if [ "$RUNNER_OS" = macOS ]; then
            cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg publish/
            cp target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz* publish/
          else
            cp target/${{ matrix.target }}/release/bundle/nsis/*.exe* publish/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.target }}
          path: publish/
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          pattern: cap-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: updater-public
          path: artifacts

      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Verify and inventory fork artifacts
        shell: bash
        run: bash scripts/verify-fork-artifacts.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Resolve exact-revision candidate
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let candidate;
            for await (const page of github.paginate.iterator(github.rest.repos.listReleases, { owner, repo, per_page: 100 })) {
              candidate = page.data.find(release => release.tag_name === tag);
              if (candidate) break;
            }
            if (!candidate) candidate = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: process.env.RELEASE_SHA, draft: true, prerelease: true, name: `Internal build ${process.env.RELEASE_SHA.slice(0, 12)}`, body: `R90 fork desktop build from ${process.env.RELEASE_SHA}. Candidate awaiting installed-artifact smoke.` })).data;
            let tagged;
            try { tagged = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data.object.sha; }
            catch (error) {
              if (error.status !== 404) throw error;
              tagged = (await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: process.env.RELEASE_SHA })).data.object.sha;
            }
            if (tagged !== process.env.RELEASE_SHA) throw new Error('Existing candidate tag revision mismatch');
            core.setOutput('release_id', candidate.id);
            core.setOutput('draft', candidate.draft);

      - name: Complete draft assets before publication
        if: steps.candidate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.candidate.outputs.release_id }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --method PATCH -F draft=false --jq .html_url

  smoke:
    needs: [build, release]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || needs.release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            script: bash scripts/smoke-fork-macos.sh
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            script: pwsh -File scripts/smoke-fork-windows.ps1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: cap-${{ matrix.target }}
          path: artifacts

      - name: Inventory pre-publication artifacts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cd artifacts
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 -- * > SHA256SUMS
          else
            sha256sum -- * > SHA256SUMS
          fi

      - name: Download published candidate
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          mkdir artifacts
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            [[ "$name" =~ ^[A-Za-z0-9._+-]+$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "artifacts/$name"
          done

      - name: Install and launch published app
        shell: bash
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}-${{ github.run_attempt }}
          path: smoke/
          if-no-files-found: error

  promote:
    needs: [release, smoke]
    if: github.event_name == 'workflow_run'
    concurrency:
      group: fork-healthy-channel
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify published bytes against the pinned fork signing root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          mkdir published
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            [[ "$name" =~ ^[A-Za-z0-9._+-]+$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "published/$name"
          done
          node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.prod.conf.json")); fs.writeFileSync(process.env.RUNNER_TEMP + "/fork-updater.pub", Buffer.from(config.plugins.updater.pubkey, "base64"));'
          minisign -Vm published/SHA256SUMS -p "$RUNNER_TEMP/fork-updater.pub" -x published/SHA256SUMS.minisig
          (cd published && sha256sum -c SHA256SUMS)

      - uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { execFileSync } = require('node:child_process');
            const sha = process.env.RELEASE_SHA;
            const candidate = (await github.rest.repos.getRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID) })).data;
            const inventory = new Set(require('node:fs').readFileSync('published/SHA256SUMS', 'utf8').trimEnd().split('\n').map(line => {
              const match = line.match(/^[0-9a-f]{64} [ *](.+)$/);
              if (!match) throw new Error('Signed checksum inventory line is invalid');
              return match[1];
            }));
            for (const asset of candidate.assets) {
              if (!['latest.json', 'SHA256SUMS', 'SHA256SUMS.minisig'].includes(asset.name) && !inventory.has(asset.name)) throw new Error('Published release includes an asset outside the signed inventory');
            }
            const assetText = async asset => {
              if (!asset) throw new Error('Required release metadata or signature is missing');
              return execFileSync('gh', ['api', `repos/${owner}/${repo}/releases/assets/${asset.id}`, '-H', 'Accept: application/octet-stream'], { encoding: 'utf8' });
            };
            const manifests = await Promise.all(['aarch64-apple-darwin', 'x86_64-pc-windows-msvc'].map(async target => {
              const manifest = JSON.parse(await assetText(candidate.assets.find(a => a.name === `release-${target}.json`)));
              if (manifest.revision !== sha || manifest.target !== target) throw new Error('Published artifact source revision mismatch');
              return manifest;
            }));
            const version = manifests[0].version;
            if (manifests[1].version !== version) throw new Error('Published native target versions disagree');
            const compareVersions = (left, right) => {
              const versions = [left, right].map(value => {
                if (!/^\d+\.\d+\.\d+$/.test(value)) throw new Error('Healthy updater version is not a stable native semver');
                return value.split('.').map(Number);
              });
              for (let index = 0; index < 3; index++) {
                const difference = versions[0][index] - versions[1][index];
                if (difference) return difference;
              }
              return 0;
            };
            compareVersions(version, version);
            const platforms = {};
            for (const [target, suffix] of [['darwin-aarch64', '.app.tar.gz'], ['windows-x86_64', '_x64-setup.exe']]) {
              const artifacts = candidate.assets.filter(a => inventory.has(a.name) && a.name.endsWith(suffix));
              if (artifacts.length !== 1) throw new Error(`Published signed updater artifact for ${target} is not unique`);
              const artifact = artifacts[0];
              const signature = (await assetText(candidate.assets.find(a => a.name === `${artifact.name}.sig`))).trim();
              if (!signature) throw new Error(`Published updater signature for ${target} is empty`);
              platforms[target] = { url: artifact.browser_download_url, signature };
            }
            const latest = JSON.stringify({ version, source_revision: sha, notes: `R90 fork build from ${sha}. Installed-artifact smoke passed on macOS Apple Silicon and Windows x64.`, pub_date: candidate.created_at, platforms }, null, 2);
            const writeManifest = async (releaseId, text, replace) => {
              const release = (await github.rest.repos.getRelease({ owner, repo, release_id: releaseId })).data;
              const existing = release.assets.find(a => a.name === 'latest.json');
              if (existing) {
                if (await assetText(existing) === text) return existing;
                if (!replace) throw new Error('Immutable candidate updater manifest differs');
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              return (await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: releaseId, name: 'latest.json', data: Buffer.from(text), headers: { 'content-type': 'application/json' } })).data;
            };
            await github.rest.repos.updateRelease({ owner, repo, release_id: candidate.id, draft: false, body: `R90 fork desktop ${version} from ${sha}. Installed-artifact smoke passed on macOS Apple Silicon and Windows x64: https://github.com/${owner}/${repo}/actions/runs/${context.runId}. macOS is ad-hoc signed, not notarized; Windows is not Authenticode signed. Updater signatures and signed SHA256SUMS are included.` });
            await writeManifest(candidate.id, latest, false);
            const downloads = candidate.assets.filter(a => a.name.endsWith('.dmg') || a.name.endsWith('.exe')).map(a => `- [${a.name}](${a.browser_download_url})`).join('\n');
            const body = `Healthy R90 fork desktop ${version} from [${sha}](https://github.com/${owner}/${repo}/commit/${sha}).\n\n${downloads}\n\n[All artifacts, updater signatures and checksums](${candidate.html_url}).\n\nInstalled-artifact smoke passed on macOS Apple Silicon and Windows x64: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n\nThe fork updater uses this release's latest.json and the existing fork signing key. Legacy clients embedding the upstream endpoint/key must install the current fork installer once.\n\nmacOS is ad-hoc signed, not notarized; Windows is not Authenticode signed. Existing first-launch OS consent remains required.`;
            let previousRelease;
            let previousSha;
            let previousManifest;
            try {
              previousRelease = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'internal-latest' })).data;
              previousSha = (await github.rest.git.getRef({ owner, repo, ref: 'tags/internal-latest' })).data.object.sha;
              const asset = previousRelease.assets.find(a => a.name === 'latest.json');
              if (asset) previousManifest = await assetText(asset);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const legacy = previousRelease?.assets.some(a => a.name.endsWith('.dmg') || a.name.endsWith('.exe'));
            if (previousSha && previousSha !== sha && !legacy) {
              const comparison = (await github.rest.repos.compareCommits({ owner, repo, base: previousSha, head: sha })).data.status;
              if (comparison === 'behind') {
                core.notice('Published immutable candidate without superseding a newer healthy build');
                return;
              }
              if (comparison !== 'ahead') throw new Error('Release channel history diverged');
            }
            if (previousManifest) {
              const previous = JSON.parse(previousManifest);
              if (previous.source_revision !== previousSha) throw new Error('Previous healthy channel source binding differs');
              const progression = compareVersions(version, previous.version);
              if (progression < 0 || (previousSha !== sha && progression === 0)) throw new Error('Candidate would not update the installed client');
            }
            const previousName = previousRelease?.name || 'Previous healthy internal build';
            const previousBody = previousRelease?.body;
            if (legacy) {
              const archiveTag = `internal-${previousSha}`;
              try { await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${archiveTag}`, sha: previousSha }); }
              catch (error) {
                if (error.status !== 422) throw error;
                const archived = (await github.rest.git.getRef({ owner, repo, ref: `tags/${archiveTag}` })).data.object.sha;
                if (archived !== previousSha) throw new Error('Existing archive tag revision mismatch');
              }
              await github.rest.repos.updateRelease({ owner, repo, release_id: previousRelease.id, tag_name: archiveTag });
              previousRelease = undefined;
            }
            let channel;
            try {
              channel = previousRelease
                ? (await github.rest.repos.updateRelease({ owner, repo, release_id: previousRelease.id, body, name: `Internal ${version} (${sha.slice(0, 12)})` })).data
                : (await github.rest.repos.createRelease({ owner, repo, tag_name: 'internal-latest', target_commitish: sha, name: `Internal ${version} (${sha.slice(0, 12)})`, body, prerelease: true, make_latest: 'false' })).data;
              await writeManifest(channel.id, latest, true);
              await github.rest.git.updateRef({ owner, repo, ref: 'tags/internal-latest', sha, force: true });
              const current = (await github.rest.git.getRef({ owner, repo, ref: 'tags/internal-latest' })).data.object.sha;
              if (current !== sha) throw new Error('Release channel revision readback failed');
              let readbackError;
              for (let attempt = 0; attempt < 3; attempt++) {
                try {
                  const response = await fetch(`https://github.com/${owner}/${repo}/releases/download/internal-latest/latest.json?run=${context.runId}`);
                  if (!response.ok || await response.text() !== latest) throw new Error(`Published updater endpoint readback failed (HTTP ${response.status})`);
                  readbackError = undefined;
                  break;
                } catch (error) {
                  readbackError = error;
                }
                if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 2000));
              }
              if (readbackError) throw readbackError;
            } catch (error) {
              if (previousSha) {
                await github.rest.git.updateRef({ owner, repo, ref: 'tags/internal-latest', sha: previousSha, force: true });
                const archiveUrl = `https://github.com/${owner}/${repo}/releases/tag/internal-${previousSha}`;
                const restoredBody = legacy ? `Restored previous fork build and retained downloads: ${archiveUrl}\n\n${previousBody || ''}` : previousBody || `Restored previous healthy build: ${archiveUrl}`;
                if (channel) {
                  await github.rest.repos.updateRelease({ owner, repo, release_id: channel.id, body: restoredBody, name: previousName });
                  if (previousManifest) await writeManifest(channel.id, previousManifest, true);
                  else {
                    const restored = (await github.rest.repos.getRelease({ owner, repo, release_id: channel.id })).data;
                    const asset = restored.assets.find(a => a.name === 'latest.json');
                    if (asset) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                  }
                } else if (!previousRelease) {
                  const restored = (await github.rest.repos.createRelease({ owner, repo, tag_name: 'internal-latest', target_commitish: previousSha, body: `Previous build and retained downloads: https://github.com/${owner}/${repo}/releases/tag/internal-${previousSha}`, name: previousName, prerelease: true, make_latest: 'false' })).data;
                  if (previousManifest) await writeManifest(restored.id, previousManifest, true);
                }
              } else if (channel) {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: channel.id });
                await github.rest.git.deleteRef({ owner, repo, ref: 'tags/internal-latest' });
              }
              throw error;
            }
            core.summary.addHeading('Fork publication verified').addLink('Healthy release channel', channel.html_url).addRaw(`\nRevision: ${sha}\nVersion: ${version}\nCandidate: ${candidate.html_url}\nTargets: aarch64-apple-darwin, x86_64-pc-windows-msvc\nInstalled-artifact smoke: passed\nUpdater endpoint readback: passed\n`);
            await core.summary.write();

  reject:
    needs: [release, smoke, promote]
    if: >-
      always() && needs.release.result == 'success' &&
      (needs.smoke.result != 'success' || needs.promote.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Withdraw unhealthy candidate without moving healthy channel
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const candidate = (await github.rest.repos.getRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID) })).data;
            if (candidate.assets.some(a => a.name === 'latest.json')) {
              core.warning('Retaining this previously smoke-healthy immutable release; the failed re-walk still requires agent triage');
              return;
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: candidate.id, draft: true });
